<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Portal del Estudiante{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body>
  <header class="portal-cabecera">
    <div class="portal-cabecera__fila">
      <img class="portal-cabecera__escudo" src="{{ url_for('static', filename='img/logo-100-anos.png') }}" alt="">
      <div>
        <div class="portal-cabecera__nombre">{{ nombre }}</div>
        <div class="portal-cabecera__meta">NIE {{ nie }}</div>
      </div>
      <a class="portal-cabecera__salir" href="{{ url_for('portal_logout') }}">Salir</a>
    </div>
  </header>

  <nav class="portal-nav">
    <div class="portal-nav__interior">
      <a href="{{ url_for('portal_inicio') }}"
         {% if seccion == 'inicio' %}aria-current="page"{% endif %}>Inicio</a>
      <a href="{{ url_for('portal_asistencia') }}"
         {% if seccion == 'asistencia' %}aria-current="page"{% endif %}>Mi asistencia</a>
      <a href="{{ url_for('portal_permiso') }}"
         {% if seccion == 'permiso' %}aria-current="page"{% endif %}>Permisos</a>
    </div>
  </nav>

  <main class="portal-cuerpo">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="aviso aviso--{{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    {% block contenido %}{% endblock %}
  </main>
</body>
</html>

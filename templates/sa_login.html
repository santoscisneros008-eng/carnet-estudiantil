<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrador general · {{ institucion }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="admin-card">
      <div class="medallon-institucion">
        <img src="{{ url_for('static', filename='img/logo-100-anos.png') }}" alt="">
      </div>
      <h1>Administrador general</h1>
      <div class="sub">{{ institucion }}</div>

      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensajes %}
          <div class="flash flash--{{ categoria }}">{{ texto }}</div>
        {% endfor %}
      {% endwith %}
      {% if error %}<div class="flash flash--error">{{ error }}</div>{% endif %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autofocus required autocomplete="username">
        </div>
        <div class="campo" style="margin-top:12px;">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="form-acciones">
          <button type="submit" class="btn-primario">Entrar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

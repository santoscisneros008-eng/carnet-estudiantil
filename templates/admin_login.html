<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · {{ institucion }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="admin-card">
      <h1>Panel de administración</h1>
      <div class="sub">{{ institucion }}</div>
      {% if error %}<div class="flash flash--error">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autofocus required autocomplete="username">
        </div>
        <div class="campo" style="margin-top:12px;">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="form-acciones">
          <button type="submit" class="btn-primario" data-cargando="Entrando...">Entrar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ institucion }} · Carné Digital</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page-inicio">
    <h1>{{ institucion }}</h1>
    <p>Sistema de carné digital de estudiantes. Cada estudiante tiene un carné accesible mediante su NIE, tarjeta NFC o código QR.</p>
    <form class="buscar-form" action="/buscar" method="get" onsubmit="event.preventDefault(); window.location.href = '/student/' + document.getElementById('nie').value.trim();">
      <input id="nie" type="text" placeholder="Escribe un NIE, ej. N0001" autocomplete="off">
      <button type="submit">Ver carné</button>
    </form>
    <p style="margin-top:28px;"><a href="/admin" style="color:var(--pizarra); font-size:12.5px;">Panel de administración →</a></p>
  </div>
</body>
</html>

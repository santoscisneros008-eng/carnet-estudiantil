<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · {{ institucion }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-login-admin">
  <div class="fondo-rotativo" aria-hidden="true">
    <div class="fondo-rotativo__capa" style="background-image:url('{{ url_for('static', filename='img/fondo_admin_1.jpg') }}');"></div>
    <div class="fondo-rotativo__capa" style="background-image:url('{{ url_for('static', filename='img/fondo_admin_2.jpg') }}');"></div>
    <div class="fondo-rotativo__capa" style="background-image:url('{{ url_for('static', filename='img/fondo_admin_3.jpg') }}');"></div>
    <div class="fondo-rotativo__velo"></div>
  </div>

  <div class="login-shell">
    <div class="admin-card">
      <div class="medallon-institucion">
        <img src="{{ url_for('static', filename='img/logo-100-anos.png') }}" alt="Escudo de {{ institucion }}">
      </div>
      <h1>Panel de administración</h1>
      <div class="sub">{{ institucion }}</div>

      {% if error %}
        <div class="flash flash--error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autofocus required autocomplete="username">
        </div>
        <div class="campo" style="margin-top:12px;">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="form-acciones">
          <button type="submit" class="btn-primario" data-cargando="Entrando...">Entrar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
